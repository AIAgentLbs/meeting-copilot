name: Publish v0.1.1 meeting isolation hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0.1.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test meeting isolation
        run: python3 copilot/web/server.py --self-test
      - name: Patch the existing macOS package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/stage"
          gh release download v0.1.0 --pattern meeting-copilot-macos.zip --dir "$RUNNER_TEMP/base"
          unzip -q "$RUNNER_TEMP/base/meeting-copilot-macos.zip" -d "$RUNNER_TEMP/stage"
          test -f "$RUNNER_TEMP/stage/payload/web/server.py"
          cp copilot/web/server.py "$RUNNER_TEMP/stage/payload/web/server.py"
          (cd "$RUNNER_TEMP/stage" && zip -qry "$RUNNER_TEMP/meeting-copilot-macos.zip" .)
          unzip -tq "$RUNNER_TEMP/meeting-copilot-macos.zip"
          shasum -a 256 "$RUNNER_TEMP/meeting-copilot-macos.zip"
      - name: Publish v0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.1.1 "$RUNNER_TEMP/meeting-copilot-macos.zip"
          --target "$GITHUB_SHA"
          --title "Meeting Copilot v0.1.1"
          --notes "Fixes live chat and journal isolation between meetings. The native capture binary is unchanged from v0.1.0."
